<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SHA & SHA MOBILES</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f1f3f6;
            font-family:'Segoe UI',sans-serif;
        }

        .register-card{
            max-width:420px;
            margin:80px auto;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .brand{
            text-align:center;
            color:#2874f0;
            font-weight:700;
            margin-bottom:25px;
        }

        .btn-register{
            background:#fb641b;
            color:white;
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="register-card">

    <h2 class="brand">SHA & SHA MOBILES</h2>

    <h4 class="text-center mb-4">Create Account</h4>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit"
                class="btn btn-register w-100">
            Register
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'login' %}">
            Already have an account?
        </a>
    </div>

</div>

</body>
</html>
