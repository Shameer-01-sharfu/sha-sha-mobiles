<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f1f3f6;">

<div class="container mt-5">

    <h2 class="mb-4">📊 Admin Dashboard</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="bg-white p-3 shadow rounded">
                <h5>Total Orders</h5>
                <h3>{{ total_orders }}</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-white p-3 shadow rounded">
                <h5>Total Products</h5>
                <h3>{{ total_products }}</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-white p-3 shadow rounded">
                <h5>Total Users</h5>
                <h3>{{ total_users }}</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-white p-3 shadow rounded">
                <h5>Pending Orders</h5>
                <h3>{{ pending_orders }}</h3>
            </div>
        </div>

    </div>

    <div class="mt-4 bg-white p-4 shadow rounded">
        <h4>Total Revenue</h4>
        <h2 class="text-success">₹ {{ total_revenue }}</h2>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <canvas id="salesChart"></canvas>
    <script>
    const ctx = document.getElementById('salesChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Orders', 'Revenue', 'Products', 'Users'],
            datasets: [{
                label: 'Stats',
                data: [{{ total_orders }}, {{ total_revenue }}, {{ total_products }}, {{ total_users }}],
                backgroundColor: ['red','green','blue','orange']
            }]
      }
    });
    </script>

</div>

</body>
</html>
